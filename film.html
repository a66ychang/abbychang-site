<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>film · Abby Chang</title>
  <link rel="stylesheet" href="gallery.css">
  <style>
    main { max-width: 620px; }
    .slideshow { text-align: center; }
    .blurb { margin-bottom: 1rem; }

    /* ---- slideshow ---- */
    .slideshow {
      position: relative;
      margin-top: 0;
    }
    .slideshow figure {
      margin: 0;
      text-align: center;
    }
    .slideshow figure:not(.active) { display: none; }
    .slideshow img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: min(70vh, 560px);
      margin: 0 auto;
      background: transparent;
      min-height: 0;
    }
    .slideshow img:not([src]) { background: #eeebe6; width: 100%; height: 300px; }  /* gray until photo added */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .controls button {
      background: none;
      border: none;
      font: inherit;
      font-size: 1.3rem;
      color: #888;
      cursor: pointer;
      padding: 0.25rem 0.75rem;
    }
    .controls button:hover { color: #8a6d4b; }
    .counter {
      font-size: 0.8rem;
      color: #aaa;
      min-width: 3.5rem;
      text-align: center;
    }


  </style>
</head>
<body>

    <a class="back" href="index.html">← back</a>

      <div class="controls">
        <button id="prev" aria-label="Previous photo">←</button>
        <span class="counter" id="counter"></span>
        <button id="next" aria-label="Next photo">→</button>
      </div>
    </section>
  </main>

  <script>
    const slides = [...document.querySelectorAll(".slideshow figure")];
    const counter = document.getElementById("counter");
    let current = 0;

    slides.forEach(fig => {
      const img = fig.querySelector("img");
      img.onerror = () => img.removeAttribute("src");
    });

    function show(i) {
      slides[current].classList.remove("active");
      current = (i + slides.length) % slides.length;   // wraps around at the ends
      slides[current].classList.add("active");
      counter.textContent = (current + 1) + " / " + slides.length;
    }

    document.getElementById("prev").onclick = () => show(current - 1);
    document.getElementById("next").onclick = () => show(current + 1);
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") show(current - 1);
      if (e.key === "ArrowRight") show(current + 1);
    });

    // swipe on phones
    let startX = null;
    const box = document.querySelector(".slideshow");
    box.addEventListener("touchstart", e => startX = e.touches[0].clientX, { passive: true });
    box.addEventListener("touchend", e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
      startX = null;
    });

    show(0);
  </script>
